name: Multi-Tenant ScheduleAI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend — isolation, RBAC & usage-limit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        env:
          # Never download the mongod binary during npm install — CI uses the
          # service container above; local runs download lazily on first use.
          MONGOMS_DISABLE_POSTINSTALL: '1'
        run: npm ci

      - name: Run Test Suite
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/scheduleai_ci_test
          JWT_SECRET: ci-test-secret-key-12345
        run: npm test

  frontend-build:
    name: Frontend — lint & production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production Build
        run: npm run build
