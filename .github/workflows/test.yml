name: Multi-Tenant ScheduleAI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Isolation & Concurrency Tests
        env:
          TEST_MONGODB_URI: mongodb://localhost:27017/scheduleai_ci_test
          JWT_SECRET: ci-test-secret-key-12345
        run: |
          cd backend
          npm test
