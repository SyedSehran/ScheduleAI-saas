server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API calls are proxied to the backend service inside the compose network.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Solver runs can take a few seconds — don't cut them off.
        proxy_read_timeout 120s;
    }

    # Single-page-app fallback so client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable — cache them aggressively.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
